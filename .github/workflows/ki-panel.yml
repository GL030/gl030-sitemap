name: KI-Panel ChatGPT (woechentlich)

on:
  schedule:
    - cron: "0 6 * * 1"   # Montag 08:00 Berlin (Sommerzeit)
  workflow_dispatch:
    inputs:
      repeats:
        description: "Durchlaeufe je Prompt (Test: 1)"
        default: "5"

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Panel ausfuehren
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPEATS: ${{ github.event.inputs.repeats || '5' }}
        run: python tools/ki_panel.py
      - name: Ergebnisse committen
        run: |
          git config user.name "gl030-sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add reports/ki-panel/
          if git diff --cached --quiet; then echo "Keine Aenderung"; else git commit -m "KI-Panel $(date -u +%F)" && git push origin HEAD:main; fi
