name: KI-Panel ChatGPT (woechentlich)

on:
  schedule:
    - cron: "0 6 * * 1"   # Montag 08:00 Berlin (Sommerzeit)
  workflow_dispatch:
    inputs:
      repeats:
        description: "Durchlaeufe je Prompt (Test: 1)"
        default: "5"

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Panel ausfuehren
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPEATS: ${{ github.event.inputs.repeats || '5' }}
        run: python tools/ki_panel.py
      - name: Ergebnisse committen
        run: |
          git config user.name "gl030-sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ki-panel/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT 2>/dev/null || true
            echo "Keine Aenderung"
          else
            git commit -m "KI-Panel $(date -u +%F)"
            # 09.10.2026: NICHT mehr "reset --soft origin/main" - das hat Dateien geloescht, die waehrend des Laufs
            # auf main kamen (KI-Panel am 09.10.). Jetzt: eigene Aenderung auf den aktuellen Stand rebasen.
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              echo "Push-Versuch $i fehlgeschlagen - neuer Versuch"; sleep $((i*5))
            done
            echo "changed=true" >> $GITHUB_OUTPUT 2>/dev/null || true
          fi