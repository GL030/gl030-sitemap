":"Budapester Straße 38-40, 10787","pr":false,"ev":[{"n":"Gen3","b":"2026-11-07T23:00","e":"2026-11-08T06:00","m":"HipHop, RnB, Latin, Afro, Trap, House","u":"https://www.gaesteliste030.de/de/berlin/events/party/07-11-26/gen3","gl":null,"tt":false,"tx":null,"tb":true}]},{"n":"Havanna","s":"havanna","lat":52.4830386,"lng":13.3542784,"a":"Haupstraße  30, 10827","pr":true,"ev":[{"n":"Saturdays @ Havanna","b":"2026-11-07T22:00","e":"2026-11-08T06:00","m":"House, HipHop, RnB, Salsa, Reggaeton, Classics","u":"https://www.gaesteliste030.de/de/berlin/events/party/07-11-26/saturdays-havanna","gl":"2026-11-07T21:00","tt":false,"tx":null,"tb":false}]},{"n":"Badehaus","s":"badehaus","lat":52.5076327,"lng":13.4543612,"a":"Revaler Straße 99, 10245","pr":false,"ev":[{"n":"¡Wepa! Bunny","b":"2026-11-07T23:30","e":"2026-11-08T04:00","m":"Reggaeton, Latin, Urban","u":"https://www.gaesteliste030.de/de/berlin/events/party/07-11-26/wepa-bunny","gl":null,"tt":false,"tx":"https://www.eventbrite.de/e/wepa-bunny-badehaus-berlin-tickets-1996097036971","tb":false}]},{"n":"Pirates","s":"pirates","lat":52.5028595,"lng":13.4456007,"a":"Mühlenstr. 78, 10243","pr":false,"ev":[{"n":"Pirates Schlager Samstag","b":"2026-11-07T19:00","e":"2026-11-08T05:00","m":"Schlager","u":"https://www.gaesteliste030.de/de/berlin/events/party/07-11-26/pirates-schlager-samstag","gl":null,"tt":false,"tx":null,"tb":true}]}];
const STAND="07.11.2026, 18:26 Uhr";
const DAY="2026-11-07";
const pad=n=>String(n).padStart(2,'0');
const dt=s=>{const[d,t]=s.split('T');const[y,m,dd]=d.split('-');const[h,mi]=t.split(':');return new Date(+y,m-1,+dd,+h,+mi)};
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={f:'all',t:'now',me:null,hl:null};
const TIMES=[['now','Jetzt'],['22:00','22:00'],['00:00','00:00'],['02:00','02:00'],['05:00','05:00']];
function nowT(){
 if(state.t==='now'){const n=new Date();const d0=dt(DAY+'T12:00'),d1=dt(DAY+'T12:00');d1.setDate(d1.getDate()+1);
  return (n>=d0&&n<d1)?n:dt(DAY+'T18:30')}
 const[h,m]=state.t.split(':');const d=dt(DAY+'T'+state.t);if(+h<12)d.setDate(d.getDate()+1);return d}
function evStatus(e,t){const b=dt(e.b);let en=e.e?dt(e.e):new Date(b.getTime()+6*36e5);
 if(t>=b&&t<en)return{k:'open',en};if(t<b)return{k:(b-t)<=3*36e5?'soon':'later',b};return{k:'past'}}
function clubStatus(c,t){let best=null;
 for(const e of c.ev){const s=evStatus(e,t);s.e=e;
  const rank={open:0,soon:1,later:2,past:3}[s.k];if(!best||rank<best.rank||(rank===best.rank&&s.k!=='past'&&dt(e.b)<dt(best.e.b)))best={...s,rank}}
 return best}
function glInfo(e,t){if(!e.gl)return null;const d=dt(e.gl);const left=d-t;
 if(left<=0)return{x:true,txt:'Gästeliste geschlossen'};
 return{warn:left<3*36e5,txt:'Gästeliste bis '+hm(d)}}
function dist(c){if(!state.me)return null;const R=6371,toR=x=>x*Math.PI/180;const dLa=toR(c.lat-state.me[0]),dLo=toR(c.lng-state.me[1]);
 const a=Math.sin(dLa/2)**2+Math.cos(toR(state.me[0]))*Math.cos(toR(c.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function enrich(){const t=nowT();return CLUBS.map(c=>{const s=clubStatus(c,t);
 const gl=c.ev.some(e=>{const g=glInfo(e,t);return g&&!g.x&&evStatus(e,t).k!=='past'});
 const tk=c.ev.some(e=>(e.tt||e.tx)&&evStatus(e,t).k!=='past');
 const own=c.ev.some(e=>e.tt);
 const tb=c.ev.some(e=>e.tb);
 return{...c,s,gl,tk,own,tb,d:dist(c)}})}
const FILTERS=[['all','Alle'],['open','Jetzt offen'],['gl','Gästeliste'],['tk','Tickets'],['tb','Tisch']];
function pass(c,f){if(f==='all')return c.s.k!=='past';if(f==='open')return c.s.k==='open';return c[f]&&c.s.k!=='past'}
function statusTxt(s){if(s.k==='open')return'Jetzt offen · bis '+hm(s.en);if(s.k==='soon'||s.k==='later')return'Öffnet '+hm(s.b);return'Heute vorbei'}
function card(c,t,inPopup){
 const ini=c.n.replace(/[^A-Za-zÄÖÜäöü0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'•';
 let h=`<article class="card s-${c.s.k}${c.pr?' pr':''}${state.hl===c.s_?' hl':''}" id="c-${esc(c.s_)}"><div class="ch"><div class="av">${esc(ini)}</div><div class="cn"><h3>${esc(c.n)}</h3><div class="st">${statusTxt(c.s)}</div></div>`;
 if(c.d!=null)h+=`<span class="dist">${c.d<1?Math.round(c.d*1000)+' m':c.d.toFixed(1)+' km'}</span>`;
 else if(c.pr&&!inPopup)h+=`<span class="pt">Partner</span>`;
 h+='</div>';
 const evs=c.ev.filter(e=>evStatus(e,t).k!=='past');
 for(const e of (evs.length?evs:c.ev.slice(-1))){
  const b=dt(e.b),g=glInfo(e,t);
  h+=`<div class="ev"><a class="en" href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.n)}</a><div class="em">${hm(b)}${e.e?'–'+hm(dt(e.e)):''}${e.m?' · '+esc(e.m):''}</div><div class="bd">`;
  if(g)h+=`<span class="b gl${g.warn?' warn':''}${g.x?' x':''}">${g.txt}</span>`;
  if(e.tt)h+=`<span class="b own">Tickets über GL030</span>`;else if(e.tx)h+=`<span class="b">Tickets</span>`;
  if(e.tb)h+=`<span class="b">Tisch</span>`;
  h+=`</div><div class="act">`;
  if(g&&!g.x)h+=`<a class="btn p" href="${esc(e.u)}#guestlist" target="_blank" rel="noopener">Auf die Gästeliste</a>`;
  if(e.tt)h+=`<a class="btn t" href="${esc(e.u)}" target="_blank" rel="noopener">Tickets kaufen</a>`;
  else if(e.tx)h+=`<a class="btn" href="${esc(e.tx)}" target="_blank" rel="noopener nofollow">Tickets ↗</a>`;
  if(!(g&&!g.x)&&!e.tt&&!e.tx)h+=`<a class="btn" href="${esc(e.u)}" target="_blank" rel="noopener">Zum Event</a>`;
  h+=`<a class="btn r" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}" target="_blank" rel="noopener" title="Route">Route</a></div></div>`;
 }
 return h+'</article>'}
let map,layer,markers={};
function render(){const t=nowT();const all=enrich().map(c=>({...c,s_:c.s}));all.forEach(c=>c.s_=c.s_&&c.s);
 all.forEach(c=>c.s_=c.s_?c.s_:null);
 all.forEach(c=>c.s_=c.n?c.s:null);
 all.forEach(c=>c.s_=c.s?c.s:null);
 all.forEach(c=>c.s_=c.s?c.s:null);
 all.forEach(c=>{c.s_=c.s;});
 all.forEach(c=>{c.s_=c.slug=c.s_?c.s_:null});
 all.forEach(c=>{c.s_=c.id=c.slugId});
 all.forEach(c=>{c.s_=c.sl});
 const vis=all.filter(c=>pass(c,state.f));
 const ord={open:0,soon:1,later:2,past:3};
 vis.sort((a,b)=> state.me?(a.d-b.d):(ord[a.s.k]-ord[b.s.k])||((b.gl?1:0)-(a.gl?1:0))||((b.pr?1:0)-(a.pr?1:0))||(dt((a.s.e||a.ev[0]).b)-dt((b.s.e||b.ev[0]).b)));
 // Zahlen
 const live=all.filter(c=>c.s.k!=='past');
 const cnt={all:live.length,open:all.filter(c=>c.s.k==='open').length,gl:all.filter(c=>pass(c,'gl')).length,tk:all.filter(c=>pass(c,'tk')).length,tb:all.filter(c=>pass(c,'tb')).length};
 document.getElementById('filters').innerHTML=FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${state.f===k}">${l}<span class="n">${cnt[k]}</span></button>`).join('');
 document.getElementById('times').innerHTML='<span class="lab">Uhrzeit:</span>'+TIMES.map(([k,l])=>`<button class="chip" data-t="${k}" aria-pressed="${state.t===k}">${l}</button>`).join('');
 document.getElementById('sum').innerHTML=`<b>${cnt.open}</b> Clubs offen · <b>${cnt.gl}</b> mit Gästeliste · <b>${cnt.tk}</b> mit Tickets`;
 document.getElementById('clock').textContent=state.t==='now'?'live '+hm(t):'Vorschau '+hm(t);
 const L=document.getElementById('list');
 L.innerHTML=(vis.length?vis.map(c=>card(c,t)).join(''):'<div class="empty">Keine Clubs für diesen Filter.</div>')+
  `<p class="note">Vorschau mit echten GL030-Daten, Stand ${STAND} (77 Events, 72 Clubs mit Koordinaten). „Offen“ = Uhrzeit liegt zwischen Beginn und Ende des Events; ohne Endzeit gelten 6 h. Gästeliste = aktive Liste bis zur Anmeldefrist. Partner-Clubs (Premium) stehen bei gleichem Status oben. Kartenkacheln: CARTO/OpenStreetMap – nur für die Vorschau, live selbst gehostet.</p>`;
 // Karte
 if(!map)return;layer.clearLayers();markers={};
 for(const c of all){if(!pass(c,state.f))continue;
  const k=c.s.k==='open'?'open':c.s.k==='soon'?'soon':'off';
  const key=c.pr||c.gl;
  const html=`<div class="pin ${k}${c.gl?' gl':''}${c.pr?' pr':''}">${c.gl?'<span class="tg">GL</span>':''}<span class="lb${key?'':' o'}">${esc(c.n)}</span></div>`;
  const sz=c.pr?26:20;
  const m=L_marker(c,html,sz,t);markers[c.n]=m}
}
function L_marker(c,html,sz,t){const icon=L.divIcon({html,className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],popupAnchor:[0,-sz/2]});
 const z=c.s.k==='open'?3000:c.gl?2000:c.s.k==='soon'?1000:0;
 return L.marker([c.lat,c.lng],{icon,zIndexOffset:z+(c.pr?500:0),title:c.n}).bindPopup(()=>card(c,t,true),{maxWidth:280}).addTo(layer)}
function initMap(){map=L.map('map',{zoomControl:false,attributionControl:true}).setView([52.507,13.41],12);
 L.control.zoom({position:'topright'}).addTo(map);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'darktiles',attribution:'© OpenStreetMap'}).addTo(map);
 map.on('zoomend',()=>document.getElementById('map').classList.toggle('z-hi',map.getZoom()>=14));
 layer=L.layerGroup().addTo(map)}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.f){state.f=b.dataset.f;render()}
 else if(b.dataset.t){state.t=b.dataset.t;render()}
 else if(b.dataset.v){document.body.className='v-'+b.dataset.v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(b.dataset.v==='map'&&map)setTimeout(()=>map.invalidateSize(),50)}
 else if(b.id==='locbtn'){if(!navigator.geolocation)return;b.textContent='… suche';navigator.geolocation.getCurrentPosition(p=>{state.me=[p.coords.latitude,p.coords.longitude];b.textContent='◎ nach Entfernung';
   L.circleMarker(state.me,{radius:7,color:'#fff',weight:2,fillColor:'#00b4dc',fillOpacity:1}).addTo(map);map.setView(state.me,14);render()},()=>{b.textContent='◎ Standort nicht verfügbar'})}
});
function fit(){const h=document.querySelector('.top').offsetHeight;document.documentElement.style.setProperty('--mh',(window.innerHeight-h)+'px');if(map)map.invalidateSize()}
addEventListener('resize',fit);
try{initMap()}catch(e){console.warn(e)}
render();fit();
setInterval(()=>{if(state.t==='now')render()},60000);
